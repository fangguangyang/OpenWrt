# Replace this starter profile with a subscription or add nodes to the Proxy group.
mode: rule
log-level: warning
ipv6: true
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: true
  enhanced-mode: redir-host
  default-nameserver:
    - 127.0.0.1:6053
  nameserver:
    - 127.0.0.1:6053
  fallback:
    - 127.0.0.1:6553
  proxy-server-nameserver:
    - 127.0.0.1:6053
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - DIRECT
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
