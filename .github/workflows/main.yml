name: Firmware

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty uses repository OPENWRT_VERSION, then latest)'
        default: ''

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      repositories: ${{ steps.feeds.outputs.repositories }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release resolver
        run: python3 -m unittest discover -s tests -v
      - name: Resolve official ImageBuilder metadata
        id: resolve
        env:
          OPENWRT_VERSION: ${{ inputs.version || vars.OPENWRT_VERSION || 'latest' }}
          DISTRO: ${{ vars.OPENWRT_DISTRO || 'immortalwrt' }}
          DEVICES: ${{ vars.OPENWRT_DEVICES || 'amd64,m28c' }}
        run: python3 scripts/release.py resolve --distro "$DISTRO" --devices "$DEVICES" --output release.json
      - name: Find matching published package feeds
        id: feeds
        env:
          PACKAGE_REPOSITORY: ${{ vars.PACKAGE_REPOSITORY || 'fangguangyang/openwrt-dist' }}
        run: python3 scripts/release.py feeds --metadata release.json --repository "$PACKAGE_REPOSITORY" --output package-feeds.json

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ImageBuilder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk libncurses-dev libssl-dev python3 rsync unzip zstd file wget
      - name: Install x64 disk and ISO image tools
        if: matrix.id == 'amd64'
        run: sudo apt-get install -y qemu-utils genisoimage
      - name: Build image with matching signed packages
        env:
          BUILD_METADATA: ${{ toJSON(matrix) }}
          FEED_URL: ${{ fromJSON(needs.prepare.outputs.repositories)[matrix.id] }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > "$RUNNER_TEMP/build.json"
          bash scripts/build-image.sh "$RUNNER_TEMP/build.json" "$FEED_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.id }}
          path: image/${{ matrix.id }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: release/
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.TOKEN || github.token }}
          tag_name: firmware-${{ needs.prepare.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          name: Firmware ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.version == 'SNAPSHOT' }}
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Automatic firmware for the selected devices (default: amd64 and Widora MangoPi M28C).
            Official ImageBuilder archives are checked against upstream SHA256 metadata.
            Each image reuses a matching signed package feed from an existing GitHub Release.
            Source: ${{ github.repository }}@${{ github.sha }}
